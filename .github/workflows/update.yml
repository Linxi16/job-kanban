name: 更新岗位数据

# 只支持手动触发（手机 GitHub App / 网页 / 看板上的按钮），
# 按用户要求不设定时任务。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取双平台最新岗位
        env:
          DATA_DIR: data
          ZL_KWS: 'HRBP,人事专员,行政专员,人力资源专员,招聘专员,人事助理,行政助理,人力资源管培生'
          ZL_CITIES: '广州,佛山,深圳,东莞,中山,珠海'
          ZL_PAGES: '2'
          QC_KWS: 'HRBP,人事专员,行政专员,人力资源专员,招聘专员,人事助理,行政助理,人力资源管培生'
          QC_CITIES: '广州,佛山,深圳,东莞'
          QC_PAGES: '2'
          GAP_MS: '5000'
        run: node cloud/fetch-all.mjs

      - name: 评分与判定
        env:
          DATA_DIR: data
        run: node score-engine.mjs

      - name: 生成战报（CSV / 汇总报告）
        env:
          DATA_DIR: data
        run: node export-report.mjs

      - name: 构建看板
        env:
          OUT_DIR: dist
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: node build-dashboard.mjs

      - name: 校验看板
        run: node verify-dashboard.mjs

      - name: 归档快照
        run: |
          mkdir -p 归档
          D=$(date +%Y%m%d-%H%M)
          cp dist/看板.html "归档/看板-$D.html" || true
          cp dist/看板数据.json "归档/看板数据-$D.json" || true

      - name: 提交结果到仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动更新岗位数据 $(date +%Y-%m-%d\ %H:%M)"
            git push
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
