name: 更新岗位数据

# 只支持手动触发（手机 GitHub App / 网页 / 看板上的按钮），
# 按用户要求不设定时任务。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-refresh
  cancel-in-progress: false

# 全流程共用的抓取参数（改这里即可，两个平台同步生效）
env:
  GAP_MS: '3800'          # 请求间隔，用户指定
  ZL_KWS: 'HRBP,人事专员,行政专员,人力资源专员,招聘专员,人事助理,行政助理,人力资源管培生'
  ZL_PAGES: '2'
  QC_KWS: 'HRBP,人事专员,行政专员,人力资源专员,招聘专员,人事助理,行政助理,人力资源管培生'
  QC_PAGES: '3'

jobs:
  # ---------- 智联招聘：按城市分 3 片并行 ----------
  zhilian:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        include:
          - shard: 1
            cities: '广州,佛山'
          - shard: 2
            cities: '深圳,东莞'
          - shard: 3
            cities: '中山,珠海'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取智联招聘（分片 ${{ matrix.shard }}：${{ matrix.cities }}）
        env:
          DATA_DIR: data
          PLATFORM: zhilian
          SHARD: ${{ matrix.shard }}
          ZL_CITIES: ${{ matrix.cities }}
        run: node cloud/fetch-all.mjs

      - name: 上传抓取结果
        uses: actions/upload-artifact@v4
        with:
          name: zhilian-shard${{ matrix.shard }}
          path: |
            data/zhilian-shard${{ matrix.shard }}-list.json
            data/fetch-report-zhilian-shard${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 3

  # ---------- 前程无忧：按城市分 3 片并行 ----------
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        include:
          - shard: 1
            cities: '广州,佛山'
          - shard: 2
            cities: '深圳,东莞'
          - shard: 3
            cities: '中山,珠海'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取前程无忧（分片 ${{ matrix.shard }}：${{ matrix.cities }}）
        env:
          DATA_DIR: data
          PLATFORM: '51job'
          SHARD: ${{ matrix.shard }}
          QC_CITIES: ${{ matrix.cities }}
        run: node cloud/fetch-all.mjs

      - name: 上传抓取结果
        uses: actions/upload-artifact@v4
        with:
          name: qc-shard${{ matrix.shard }}
          path: |
            data/51job-shard${{ matrix.shard }}-list.json
            data/fetch-report-51job-shard${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 3

  # ---------- 合并 6 个分片 → 评分 → 构建 → 发布 ----------
  refresh:
    needs: [zhilian, qc]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载全部分片结果
        uses: actions/download-artifact@v4
        with:
          pattern: '*-shard*'
          path: data
          merge-multiple: true

      - name: 合并分片
        env:
          DATA_DIR: data
        run: node cloud/merge-shards.mjs

      - name: 评分与判定
        env:
          DATA_DIR: data
        run: node score-engine.mjs

      - name: 生成战报（CSV / 汇总报告）
        env:
          DATA_DIR: data
        run: node export-report.mjs

      # 回归用例：造数据 → 用引擎评分 → 校验判定。
      # 放在构建看板之前，判定逻辑一旦被改坏就在这里失败，不会发布出去。
      - name: 回归用例（应届生判定）
        run: |
          node test-fresh-bug.mjs --make
          DATA_DIR=.tmp-fresh-test node score-engine.mjs
          DATA_DIR=.tmp-fresh-real node score-engine.mjs
          node test-fresh-bug.mjs --check

      - name: 回归用例（硬过滤：实习 / 方向 / 地域 / 薪资）
        run: |
          node test-hard-filter.mjs --make
          DATA_DIR=.tmp-hard-filter node score-engine.mjs
          node test-hard-filter.mjs --check

      - name: 构建看板（本地完整版）
        run: node build-dashboard.mjs

      - name: 校验看板（本地完整版）
        run: node verify-dashboard.mjs

      - name: 构建看板（云端发布版·脱敏）
        env:
          OUT_DIR: dist
          SANITIZE: '1'
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: node build-dashboard.mjs

      - name: 校验发布版（结构 + 脱敏）
        run: node verify-dist.mjs

      - name: 归档快照（只保留最近 10 份）
        run: |
          mkdir -p 归档
          D=$(date +%Y%m%d-%H%M)
          cp dist/看板.html "归档/看板-$D.html" || true
          cp dist/看板数据.json "归档/看板数据-$D.json" || true
          ls -1t 归档/看板-*.html 2>/dev/null | tail -n +11 | xargs -r rm -f
          ls -1t 归档/看板数据-*.json 2>/dev/null | tail -n +11 | xargs -r rm -f
          echo "归档文件数: $(ls -1 归档 | wc -l)"

      - name: 提交结果到仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动更新岗位数据 $(date +%Y-%m-%d\ %H:%M)"
            git push
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
