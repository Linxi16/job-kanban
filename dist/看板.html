<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>岗位看板 · 林小夕</title>
<!-- 本地文件禁用缓存，避免 Edge 展示旧版页面 -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
:root{
  --bg:#f5f7fa; --card:#fff; --ink:#161a1f; --ink2:#5a6472; --ink3:#9aa3af;
  --line:#e6eaf0; --line2:#f0f3f7;
  --accent:#2563eb; --accent-soft:#eef4ff;
  --zl:#2563eb; --zl-soft:#eef4ff;      /* 智联招聘：蓝 */
  --qc:#dc2626; --qc-soft:#fef2f2;      /* 前程无忧：红 */
  --hot:#dc2626; --hot-soft:#fef2f2;    /* 评分 ≥90 */
  --mid:#ea8a04; --mid-soft:#fff8ed;    /* 60–79 */
  --low:#64748b; --low-soft:#f1f5f9;    /* <60 */
  --good:#15803d; --good-soft:#f0fdf4;
  --bad:#dc2626;
  --r:12px; --r2:9px;
  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh2:0 4px 14px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:18px/1.78 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-feature-settings:"halt" 1;
}
.wrap{max-width:1440px;margin:0 auto;padding:40px 34px 96px}

/* ---------- 顶栏 ---------- */
header{margin-bottom:32px}
h1.title-main{
  margin:0;text-align:center;font-size:44px;font-weight:800;letter-spacing:2px;
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px}
.stamp{font-size:15.5px;color:var(--ink3)}
button{
  font:inherit;font-size:16px;cursor:pointer;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:11px 22px;border-radius:var(--r2);transition:.16s;box-shadow:var(--sh);
}
button:hover{border-color:#cfd8e3;background:#fcfdff}
button.primary{background:#16a34a;border-color:#16a34a;color:#fff;box-shadow:0 1px 2px rgba(22,163,74,.3)}
button.primary:hover{background:#15803d;border-color:#15803d}
button:disabled{opacity:.5;cursor:default}
/* ---------- 云端抓取进度条（仅刷新时显示）---------- */
#refresh-progress{display:none;margin:14px 0 4px}
#refresh-progress.on{display:block}
.pbar{display:flex;align-items:center;gap:12px}
.pbar .ptrack{flex:1;height:12px;background:#e6ecf3;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.06)}
.pbar .pfill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#facc15,#22c55e);transition:width .5s ease}
#refresh-progress.done .pfill{background:linear-gradient(90deg,#22c55e,#15803d)}
.pbar .pnote{font-size:15.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- 平台切换（对称居中，各平台专属色）---------- */
.tabs{display:flex;justify-content:center;margin-bottom:32px}
.tabs .seg{display:inline-flex;gap:10px;padding:8px;background:#e9edf3;border-radius:17px}
.tabs button{
  border:0;background:transparent;padding:15px 52px;border-radius:13px;
  font-size:18px;font-weight:600;color:var(--ink2);box-shadow:none;
  display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.3;min-width:200px;
}
.tabs button:hover{background:rgba(255,255,255,.7)}
.tabs button .cnt{font-size:14px;font-weight:500;color:var(--ink3);letter-spacing:.2px}
.tabs button[data-key=zhilian].on{background:var(--zl);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.32)}
.tabs button[data-key=zhilian].on .cnt{color:rgba(255,255,255,.82)}
.tabs button[data-key="51job"].on{background:var(--qc);color:#fff;box-shadow:0 3px 10px rgba(220,38,38,.32)}
.tabs button[data-key="51job"].on .cnt{color:rgba(255,255,255,.82)}

/* ---------- 工具条 ---------- */
.bar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 22px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;
  box-shadow:var(--sh);
}
.bar label{font-size:15.5px;color:var(--ink3);font-weight:500}
select{
  font:inherit;font-size:16px;padding:10px 16px;border:1px solid var(--line);
  border-radius:var(--r2);background:#fff;color:var(--ink);outline:none;cursor:pointer;
}
select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px;flex:1 1 auto}
.chip{
  font-size:15.5px;padding:9px 20px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer;user-select:none;transition:.16s;white-space:nowrap;
}
.chip:hover{border-color:#c3cedb;color:var(--ink);background:#fcfdff}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(37,99,235,.28)}

/* ---------- 岗位网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(620px,1fr));gap:20px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 24px 20px;display:flex;flex-direction:column;gap:15px;
  transition:.18s;position:relative;box-shadow:var(--sh);
}
.card:hover{border-color:#d5dee9;box-shadow:var(--sh2);transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--low)}
.card.idx-hot::before{background:var(--hot)}
.card.idx-mid::before{background:var(--mid)}

.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.t{font-size:19.5px;font-weight:650;line-height:1.5;margin:0;flex:1;min-width:0;letter-spacing:.1px}
.t a{color:inherit;text-decoration:none;transition:.15s}
.t a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.sc{flex:0 0 auto;text-align:right;line-height:1.1}
.sc b{display:block;font-size:35px;font-weight:700;letter-spacing:-1px}
.sc i{font-style:normal;font-size:13.5px;color:var(--ink3);letter-spacing:.2px}
.idx-hot .sc b{color:var(--hot)} .idx-mid .sc b{color:var(--mid)} .idx-low .sc b{color:var(--low)}

.co{font-size:15.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-top:-6px}
.co span{font-weight:500;color:var(--ink)}
.co em{font-style:normal;color:var(--ink3)}
.sal{font-size:19px;font-weight:680;color:#b45309;letter-spacing:.1px}

/* ---------- 结构化信息（缺失即"未提及"）---------- */
.meta{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 24px;
  background:#fafbfd;border:1px solid var(--line2);border-radius:var(--r2);padding:16px 18px;
}
.meta .mi{display:flex;gap:9px;font-size:15.5px;line-height:1.6;min-width:0}
.meta .mi b{flex:0 0 96px;font-weight:500;color:var(--ink3)}
.meta .mi span{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.meta .mi.none span{color:var(--ink3)}
.meta .mi.wide{grid-column:1/-1}
.modtag{
  display:inline-block;font-size:15px;font-weight:600;padding:4px 12px;margin:0 7px 5px 0;
  border-radius:6px;background:var(--good-soft);color:var(--good);white-space:nowrap;cursor:help;
}
.modtag .pct{
  font-style:normal;font-weight:700;font-size:13px;margin-left:5px;
  font-variant-numeric:tabular-nums;opacity:.72;
}

.badge{
  display:inline-block;font-size:15px;font-weight:600;padding:4px 13px;border-radius:6px;
  background:var(--low-soft);color:var(--low);white-space:nowrap;
}
.badge.b1{background:var(--hot-soft);color:var(--hot)}
.badge.b2{background:var(--mid-soft);color:var(--mid)}
.badge.b3{background:var(--accent-soft);color:var(--accent)}
.badge.b4{background:var(--low-soft);color:var(--low)}

details{border-top:1px solid var(--line2);padding-top:13px;margin-top:1px}
details summary{
  cursor:pointer;font-size:15.5px;color:var(--ink3);list-style:none;
  display:flex;align-items:center;gap:7px;user-select:none;transition:.15s;
}
details summary::-webkit-details-marker{display:none}
details summary:hover{color:var(--accent)}
details summary::before{content:"▸";font-size:11px;transition:.2s;display:inline-block}
details[open] summary::before{transform:rotate(90deg)}
.bd{font-size:15.5px;color:var(--ink2);margin-top:14px;display:flex;flex-direction:column;gap:12px}
.bd .row{display:flex;gap:9px;flex-wrap:wrap}
.pill{font-size:14px;padding:4px 12px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.pill.m{background:var(--mid-soft);color:var(--mid)}
.pill.n{background:var(--hot-soft);color:var(--hot)}
.jd{
  white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.9;
  color:var(--ink2);max-height:420px;overflow:auto;background:#fafbfd;
  border:1px solid var(--line2);border-radius:var(--r2);padding:16px 18px;
}
.jd mark{background:#fef08a;color:#713f12;padding:0 2px;border-radius:2px;font-weight:600}
.empty{text-align:center;color:var(--ink3);padding:76px 24px;font-size:15.5px}
.footline{
  color:var(--ink2);font-size:16px;font-weight:500;
}
.note{
  background:#fffdf5;border:1px solid #f3e3b8;border-radius:var(--r);
  padding:14px 18px;font-size:14.5px;color:#8a6d1f;margin-bottom:18px;
}
footer{margin-top:52px;padding-top:24px;border-top:1px solid var(--line);font-size:15px;color:var(--ink3);line-height:2}

@media(max-width:760px){
  body{font-size:17px}
  .wrap{padding:22px 16px 64px}
  h1{font-size:24px}
  .grid{grid-template-columns:1fr;gap:16px}
  .tabs .seg{width:100%;gap:6px}
  .tabs button{flex:1;min-width:0;padding:12px 8px;font-size:16.5px}
  .meta{grid-template-columns:1fr;gap:9px}
  .meta .mi b{flex-basis:88px}
  .t{font-size:18px}
  .sc b{font-size:30px}
}
</style>
</head>

    .replace(/[ \t\u00a0\u3000]*\n[ \t\u00a0\u3000]*/g, '\n')   // 去行首行尾空白，保留换行
    .replace(/[ \t\u00a0\u3000]{2,}/g, ' ');                        // 行内连续空白压成一个
  // 同一行里写了多个小节标题（如「【任职要求】…【岗位职责】…」）→ 在小节标题前断行
  nrm = nrm.replace(SEC_BREAK, '\n$1');
  var lines = nrm.split('\n');
  var duty = '';
  var rest = [];              // 非职责段内容（要求/待遇/前言）
  var inDuty = false, inAsk = false, sawAsk = false;
  for (var i = 0; i < lines.length; i++) {
    var L = lines[i].trim(); if (!L) continue;
    // 行首【…】小节标签：只按标签判归属，不受整行长度影响
    var bm = /^(【[^】]{2,14}】)/.exec(L);
    if (bm) {
      var tag = bm[1];
      if (SEC_DUTY.test(tag) && !SEC_ASK.test(tag)) {
        inDuty = true; inAsk = false;
        L = L.slice(tag.length).trim();
        if (!L) continue;
      } else if (SEC_ASK.test(tag) && !SEC_DUTY.test(tag)) {
        inAsk = true; inDuty = false; sawAsk = true;
        L = L.slice(tag.length).trim();
        if (!L) continue;
      }
    } else if (L.length <= 24 && SEC_DUTY.test(L) && !SEC_ASK.test(L)) {
      inDuty = true; inAsk = false; continue;
    } else if (L.length <= 26 && SEC_ASK.test(L) && !SEC_DUTY.test(L)) {
      inAsk = true; inDuty = false; sawAsk = true; continue;
    }
    if (inDuty) duty += L + '\n';
    else if (!inAsk) rest.push(L);
  }
  // 有独立职责段 → 只认职责段
  if (duty.length >= 20) return duty;
  // 无职责段但也不存在「要求/待遇」段 → 整篇就是工作内容描述
  if (!sawAsk) return nrm;
  // 存在要求段却没有职责段 → 只剩未分类内容；若为空则无可判定内容（不硬凑命中）
  var tail = rest.filter(function(L){
    return !(L.length <= 24 && SEC_DUTY.test(L)) && !(L.length <= 26 && SEC_ASK.test(L));
  }).join('\n');
  return tail.length >= 20 ? tail : '';
}

function modsOf(j){
  // 工作模块只依据 JD 正文的实际工作内容判定；JD 缺失或过短时直接返回空（绝不拿标题猜）
  var hay = modHay(j);
  if (!hay) return [];
  return MODULES.filter(function(m){ return MOD_PAT[m].test(hay); });
}

/* 把 JD 的职责段切成一条条具体工作内容
   切分点：换行、编号（1、 / 1. / 1) / 1． / （1） ）、中文序号（一、 / 二、 …） */
function dutyItems(j){
  var hay = modHay(j);
  if (!hay) return [];
  return hay.replace(/\r/g, '')
    .split(/\n|(?=\d{1,2}\s*[、.．)）])|(?=[一二三四五六七八九十]{1,2}\s*[、.．)）])/)
    .map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length >= 4; });
}

/* 单个模块的提及条数（组成工作内容的原始信号） */
function modCount(j, m){
  var items = dutyItems(j);
  if (!items.length) return 0;
  var n = 0;
  for (var i = 0; i < items.length; i++) if (MOD_PAT[m].test(items[i])) n++;
  return n;
}

/* 全部模块的占比：以「各模块提及条数」为权重做归一化分配，合计恒为 100%。
   只有被提及的模块参与分配（未提及的不显示）；每项取整到 5% 的刻度，
   取整产生的零头补给「小数部分最大」的模块，保证加总仍为 100%。 */
function modWeights(j){
  var items = dutyItems(j);
  var out = {}, i, m;
  for (i = 0; i < MODULES.length; i++) out[MODULES[i]] = 0;
  if (!items.length) return out;
  var cnt = [], total = 0;
  for (i = 0; i < MODULES.length; i++) {
    var m0 = MODULES[i], n = modCount(j, m0);
    cnt.push({ m: m0, n: n });
    total += n;
  }
  if (!total) return out;
  var live = cnt.filter(function(o){ return o.n > 0; });
  var acc = 0, parts = [];
  for (i = 0; i < live.length; i++) {
    var exact = live[i].n / total * 100;
    var v = Math.round(exact / 5) * 5;
    if (v < 5) v = 5;                                  // 被提及至少要有一格
    if (v > 100) v = 100;
    parts.push({ m: live[i].m, v: v, frac: exact - v });
    acc += v;
  }
  // 取整后的零头：差多少就从"被高估最多"的模块上挪，或补给"被低估最多"的模块
  var diff = 100 - acc;
  while (diff !== 0) {
    var best = -1, bestVal = null, step = diff > 0 ? 5 : -5;
    for (i = 0; i < parts.length; i++) {
      var nv = parts[i].v + step;
      if (nv < 5 || nv > 100) continue;
      // 正向补：小数部分越大越优先；反向扣：被高估越多越优先
      var score = step > 0 ? -parts[i].frac : parts[i].frac;
      if (bestVal === null || score > bestVal) { bestVal = score; best = i; }
    }
    if (best < 0) break;
    parts[best].v += step;
    diff -= step;
  }
  for (i = 0; i < parts.length; i++) out[parts[i].m] = parts[i].v;
  return out;
}

/* 兼容旧调用：单模块占比（取归一化后的结果） */
function modWeight(j, m){
  return modWeights(j)[m] || 0;
}

/* 模块命中的依据原文（给用户看"为什么算命中"）：取所在职责条目整句 */
function modWhy(j, m){
  var items = dutyItems(j);
  if (!items.length) return [];
  var out = [];
  for (var i = 0; i < items.length && out.length < 2; i++) {
    if (!MOD_PAT[m].test(items[i])) continue;
    var s = items[i].slice(0, 64);
    if (items[i].length > 64) s += '…';
    out.push(s);
  }
  return out;
}

/* ---------- 原始评分（0–100 百分制，直接展示引擎评分，不再做平台内相对归一化） ---------- */
var REC_MIN = 75;                       // 「推荐岗位」门槛：75 分以上
function raw(j){
  var v = Number(j.score);
  if (!isFinite(v)) v = 0;
  v = Math.round(v);
  return v < 0 ? 0 : (v > 100 ? 100 : v);
}
function isRec(j){ return j.v !== '不推荐' && raw(j) >= REC_MIN; }
function scoreCls(v){ return v >= 90 ? 'idx-hot' : (v >= 75 ? 'idx-mid' : 'idx-low'); }

/* ---------- 筛选条件（用户指定 4 项）---------- */
var FILTERS = [
  { id:'rec',   label:'推荐岗位',   test:function(j){ return isRec(j); } },
  { id:'fresh', label:'接受应届生', test:function(j){ return !!j.fresh; } },
  { id:'rest',  label:'双休',       test:function(j){ return j.rest === '双休'; } },
  { id:'bp',    label:'BP＆管培生', test:function(j){ return !!j.bp; } }
];

/* ---------- 薪资解析（取区间下限，单位 k/月） ---------- */
function salaryK(j){
  var t = String(j.s || '').replace(/\s/g,'');
  var m = t.match(/([\d.]+)\s*[-~至]\s*([\d.]+)\s*万/);
  if (m) return parseFloat(m[1]) * 10;
  m = t.match(/([\d.]+)\s*[-~至]\s*([\d.]+)\s*千/);
  if (m) return parseFloat(m[1]);
  m = t.match(/([\d.]+)\s*[-~至]\s*([\d.]+)/);
  if (m) { var v = parseFloat(m[1]); return v > 1000 ? v/1000 : v; }
  m = t.match(/(\d{4,6})/);
  if (m) return Number(m[1]) / 1000;
  return 0;
}
/* 经验门槛数值化：越小门槛越低 */
function expRank(e){
  var t = String(e || '');
  if (/不限|无经验|应届/.test(t)) return 0;
  if (/1年以下|1年以内/.test(t)) return 1;
  if (/1-3年|1年以上/.test(t)) return 2;
  if (/3-5年|3年以上/.test(t)) return 3;
  if (/5-10年|5年以上/.test(t)) return 4;
  if (/10年以上/.test(t)) return 5;
  return 2;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function cur(){ return PLAT[state.tab]; }
/* 某平台的「推荐岗位」条数 = 未被过滤 且 评分 ≥ 80 */
function recCount(p){

}

/* 单项：值缺失即显示"未提及" */
function mi(label, val, wide){
  var v = (val == null ? '' : String(val)).trim();
  var none = !v || /^(未提及|未知|-|—|--)$/.test(v);
  return '<div class="mi' + (none ? ' none' : '') + (wide ? ' wide' : '') + '">'
    + '<b>' + esc(label) + '</b><span>' + esc(none ? '未提及' : v) + '</span></div>';
}

function jobCard(j){
  var v = raw(j), vc = scoreCls(v);
  var loc = esc(j.city) + (j.dist ? '·' + esc(j.dist) : '');

  // 发布时间
  var pub = j.pub ? (j.pub + (typeof j.days === 'number' ? '（' + j.days + '天前）' : '')) : '';
  // 经验要求
  var exp = j.exp || '';
  // 是否接受应届生
  var fresh = j.fresh ? '接受应届生' : (/不限|无经验/.test(exp) ? '经验不限' : (/1-3年|1年以上|3-5年|5-10年|10年以上/.test(exp) ? '需工作经验' : ''));
  if (!fresh && j.grad && /接受2026届|2026\/2027届均可/.test(j.grad)) fresh = '接受2026届毕业生';
  // 学历
  var deg = j.deg || '';
  // 公司规模
  var size = j.size || '';
  // 工作模块：按 JD 职责条目算出占比（5% 刻度，合计 100%）
  // 只显示 JD 中实际提及的模块，按固定模块顺序排列，悬停可见判定依据
  var modW = modWeights(j);
  var modHtml = MODULES.filter(function(m){ return modW[m] > 0; }).map(function(m){
    var pct = modW[m];
    var why = modWhy(j, m).join(' ／ ');
    var tip = '依据 JD：' + why + '（占工作内容 ' + pct + '%，按职责条目提及比例，合计 100%）';
    return '<span class="modtag"' + (tip ? ' title="' + esc(tip) + '"' : '') + '>'
      + m + '<i class="pct">' + pct + '%</i></span>';
  }).join('');

  var meta = '<div class="meta">'
    + mi('发布时间', pub)
    + mi('经验要求', exp)
    + mi('接受应届生', fresh)
    + mi('学历要求', deg)
    + mi('公司规模', size)
    + '<div class="mi wide"><b>工作模块</b><span>' + modHtml + '</span></div>'
    + '</div>';

  var body = '';
  var hasEvidence = (j.bon || []).length || (j.pen || []).length || (j.neg || []).length;
  if (hasEvidence) {
    body += '<div class="row"><strong style="font-size:12px;color:var(--ink3);font-weight:500">评分依据</strong>'
      + (j.bon || []).map(function(b){ return '<span class="pill">' + esc(b.k) + ' +' + b.v + '</span>'; }).join('')
      + (j.pen || []).map(function(b){ return '<span class="pill m">' + esc(b.k) + ' ' + b.v + '</span>'; }).join('')
      + (j.neg || []).map(function(n){ return '<span class="pill n">过滤：' + esc(n) + '</span>'; }).join('')
      + '</div>';
  }
  if (j.jd && j.jd.length > 20) {
    body += '<div class="row"><strong style="font-size:12px;color:var(--ink3);font-weight:500">岗位描述</strong></div>'
      + '<div class="jd">' + hl(j.jd) + '</div>';
  }
  var details = body ? '<details><summary>评分依据 / 岗位描述</summary><div class="bd">' + body + '</div></details>' : '';

  // 附加信息条：只保留作息制度 + 工作时间 + 弹性打卡（评分已由右上角分数体现，不再重复）
  var extra = [];
  extra.push('<span class="badge' + (j.rest === '双休' ? ' b3' : '') + '">' + esc(j.rest || '作息未提及') + '</span>');
  if (j.hours) extra.push('<span class="badge">' + esc(j.hours) + '</span>');
  if (j.flex === '是') extra.push('<span class="badge b3">弹性打卡</span>');

  return '<article class="card ' + vc + '">'
    + '<div class="top">'
    +   '<h2 class="t">' + (j.url ? '<a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.t) + '</a>' : esc(j.t)) + '</h2>'
    +   '<div class="sc"><b>' + v + '</b><i>推荐指数</i></div>'
    + '</div>'
    + '<div class="co"><span>' + esc(j.c) + '</span><em>' + loc + '</em></div>'
    + (j.s ? '<div class="sal">' + esc(j.s) + '</div>' : '')
    + meta
    + '<div class="row" style="display:flex;gap:6px;flex-wrap:wrap">' + extra.join('') + '</div>'
    + details
    + '</article>';
}

var HL_RE = /(双休|周末双休|单休|大小周|排班轮休|弹性打卡|不打卡|弹性工作|六险一金|五险一金|包吃|包住|餐补|房补|交通补贴|下午茶|年终奖|带薪年假|节日福利|团建|应届|无经验|经验不限|接受小白|可转正|朝九晚六)/g;
function hl(txt){
  return esc(txt).replace(HL_RE, '<mark>$1</mark>');
}

function renderGrid(){
  var p = cur();
  // 只展示评分达到「推荐岗位」门槛（75 分）的岗位；不推荐岗位与低分岗位都不进入网格
  var jobs = (p.jobs || []).filter(isRec);
  var active = Object.keys(state.filters);
  if (active.length) {
    jobs = jobs.filter(function(j){
      for (var i = 0; i < active.length; i++) {
        var f = FILTERS.filter(function(x){ return x.id === active[i]; })[0];
        if (f && !f.test(j)) return false;
      }
      return true;
    });
  }
  if (state.sort === 'score') {
    jobs.sort(function(a,b){ return (b.score - a.score) || ((a.days==null?999:a.days) - (b.days==null?999:b.days)); });
  } else if (state.sort === 'pub') {
    jobs.sort(function(a,b){ return String(b.pub||'').localeCompare(String(a.pub||'')) || (b.score - a.score); });
  } else if (state.sort === 'sal') {
    jobs.sort(function(a,b){ return salaryK(b) - salaryK(a) || (b.score - a.score); });
  } else if (state.sort === 'exp') {
    jobs.sort(function(a,b){ return expRank(a.exp) - expRank(b.exp) || (b.score - a.score); });
  }
  var LIMIT = 300;
  var shown = jobs.slice(0, LIMIT);
  elGrid.innerHTML = shown.length
    ? shown.map(jobCard).join('')
    : '<div class="empty">当前平台没有达到 75 分的推荐岗位，试试取消筛选条件。</div>';
  if (jobs.length > LIMIT) {
    elNotice.innerHTML = '<div class="note">符合条件共 ' + jobs.length + ' 条，为保证流畅只展示前 ' + LIMIT + ' 条。请增加筛选条件以缩小范围。</div>';
  } else {
    elNotice.innerHTML = '';
  }
}

function render(){
  renderTabs(); renderChips(); renderGrid();
  if (elFootPlat) elFootPlat.textContent = cur().label;
}

/* ---------- 云端更新：GitHub Actions 触发 ---------- */
var GH_OWNER = 'Linxi16', GH_REPO = 'job-kanban', GH_WF = 'update.yml', GH_WF_NAME = '更新岗位数据';
var GH_KEY = 'wjl-gh-token';
var GH_API = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/actions';
function ghToken(){
  var t = '';
  try { t = localStorage.getItem(GH_KEY) || ''; } catch(e) {}
  if (!t) {
    t = (prompt('首次使用：粘贴你的 GitHub 令牌（只保存在本机浏览器，不会上传到任何地方）\n\n生成地址：github.com/settings/tokens\n只需勾选 repo + workflow') || '').trim();
    if (t) { try { localStorage.setItem(GH_KEY, t); } catch(e) {} }
  }
  return t;
}
function ghFetch(url, opt){
  opt = opt || {};
  var h = { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + (opt.token || '') };
  if (opt.method === 'POST') h['Content-Type'] = 'application/json';
  return fetch(url, { method: opt.method || 'GET', headers: h, body: opt.body, cache: 'no-store' });
}
document.getElementById('refresh').onclick = function(){
  var btn = this;
  var used = quotaUsed();
  var left = DAILY_LIMIT - used;
  if (left <= 0) { alert('无剩余次数'); return; }
  if (!confirm('今日剩余次数：' + left + '\n\n确定要刷新数据吗？\n（云端抓取约 10–12 分钟，期间可继续浏览）')) return;
  var token = ghToken();
  if (!token) { alert('未配置令牌，无法触发云端更新。\n\n你也可以在手机上打开 github.com/' + GH_OWNER + '/' + GH_REPO + '/actions 手动点击运行。'); return; }
  setQuota(used + 1);

  var old = btn.textContent;
  btn.disabled = true; btn.textContent = '正在触发…';
  showBar(); setProgress(2, '已触发，正在排队…');

  ghFetch(GH_API + '/workflows/' + GH_WF + '/dispatches', {
    method: 'POST', token: token,
    body: JSON.stringify({ ref: 'main', inputs: {} })
  }).then(function(r){
    if (r.status === 401 || r.status === 403) throw new Error('令牌无效或权限不足（需要 repo + workflow）');
    if (!r.ok && r.status !== 204) throw new Error('触发失败 HTTP ' + r.status);
    btn.textContent = '云端抓取中…';
    var deadline = Date.now() + 30 * 60 * 1000;
    var POLL_MS = 30000;   // 每 30 秒向云端查询一次
    function poll(){
      if (Date.now() > deadline) { finish('抓取时间较长，请稍后手动刷新页面查看结果。'); return; }
      ghFetch(GH_API + '/workflows/' + GH_WF + '/runs?per_page=1', { token: token })
        .then(function(r){ return r.json(); })
        .then(function(j){
          var run = j && j.workflow_runs && j.workflow_runs[0];
          if (!run || run.status === 'queued') {
            setProgress(3, '云端排队中…');
            setTimeout(poll, POLL_MS);
          } else if (run.status === 'in_progress') {
            pollSteps(run.id, token, function(){ setTimeout(poll, POLL_MS); });
          } else if (run.conclusion === 'success') {
            setProgress(100, '更新完成，正在重新载入…');
            btn.textContent = '更新完成';
            setTimeout(function(){ location.reload(); }, 1800);
          } else {
            finish('云端更新失败：' + run.conclusion + '\n\n可打开 github.com/' + GH_OWNER + '/' + GH_REPO + '/actions 查看日志。');
          }
        })
        .catch(function(){ setTimeout(poll, POLL_MS); });
    }
    setTimeout(poll, 5000);
  }).catch(function(e){
    var back = DAILY_LIMIT - quotaUsed();
    finish('无法触发云端更新：' + e.message + '\n\n本次不计入次数，今日剩余：' + back + ' 次');
  });

  function finish(msg){
    btn.disabled = false; btn.textContent = old;
    hideBar();
    if (msg) alert(msg);
  }
};

/* ---------- 进度条 ---------- */
var elProg = document.getElementById('refresh-progress');
var elFill = document.getElementById('pfill');
var elNote = document.getElementById('pnote');
function showBar(){ if (elProg) elProg.className = 'on'; }
function hideBar(){ if (elProg) elProg.className = ''; }
function setProgress(p, note){
  p = Math.max(0, Math.min(100, Math.round(p)));
  if (elFill) elFill.style.width = p + '%';
  if (elNote) elNote.textContent = p + '%' + (note ? ' · ' + note : '');
}
/** 用已完成的步骤数推算进度（抓取占大头，用步骤内的耗时做插值） */
function pollSteps(runId, token, done){
  ghFetch(GH_API + '/runs/' + runId + '/jobs', { token: token })
    .then(function(r){ return r.json(); })
    .then(function(j){
      var steps = (j.jobs && j.jobs[0] && j.jobs[0].steps) || [];
      var total = 0, finished = 0, active = null;
      steps.forEach(function(s){ if (s.conclusion !== 'skipped') { total++; if (s.status === 'completed') finished++; else if (!active) active = s; } });
      if (!total) { setProgress(5, '云端已启动…'); }
      else {
        var pct = finished / total * 100;
        var name = active ? active.name : '处理中';
        var note = name.replace(/（.*?）/g, '').replace(/^抓取双平台最新岗位$/, '抓取岗位中');
        setProgress(pct, finished >= total ? '正在发布…' : note + ' ' + (finished + 1) + '/' + total);
      }
    })
    .catch(function(){})
    .then(function(){ done && done(); });
}

/* ---------- 每日刷新次数（每日凌晨重置）---------- */
var DAILY_LIMIT = 3;
var QUOTA_KEY = 'wjl-refresh-quota';
function todayKey(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function quotaUsed(){
  try {
    var o = JSON.parse(localStorage.getItem(QUOTA_KEY) || 'null');
    if (!o || o.d !== todayKey()) return 0;     // 跨天自动重置
    return o.n || 0;
  } catch(e) { return 0; }
}
function setQuota(n){
  try { localStorage.setItem(QUOTA_KEY, JSON.stringify({ d: todayKey(), n: n })); } catch(e) {}
}


function stamp(){
  var d = new Date(DATA.builtAt || DATA.generatedAt);
  if (isNaN(d.getTime())) d = new Date();
  var ds = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  elStamp.textContent = 'v1 ● ' + ds + ' ——林小夕';
}
document.title = '岗位看板 v1 · 智联 + 前程';

elSort.value = state.sort;
render(); stamp();
})();
